<!--
  外聘評選委員的線上回覆頁（**公網版**，決策者 2026-09-05）

    「院外的教授連不進 192.168.45.54，回覆頁放到 Supabase 去。」

  院內版是 `src/components/Invite/InviteReplyPage.tsx`（React，打 .54 的
  `/api/invite/:token`）。收信的是院外的教授，他在家裡點信裡的按鈕時連不到
  院內網段，所以這一份是**同一個畫面的靜態拷貝**，放在 Supabase Storage 的
  公開桶 `public-pages/invite.html`，讀寫走兩支 PostgREST 函式。

  ## 為什麼是「一個檔、沒有框架、沒有外部資源」

    - Storage 只是個檔案櫃，沒有打包、沒有路由。一個 .html 就是全部。
    - 外部 CDN 對院外的委員多一個失敗點（公司防火牆擋、離線），
      而這一頁的工作只是「四個問題按一按送出」——不值得為它引一個框架。
    - CSS 與 JS 全部行內，字體用系統內建的（不載 Google Fonts）。
      顏色與字級照抄 `src/index.css` 的 token 值，看起來與院內頁一致。

  ## 資料進出只有兩支函式

    invite_public_view(p_token uuid)  → 這一位看得到的最小集合（找不到回 null）
    invite_public_reply(p_token uuid, p_reply jsonb) → { ok, repliedAt }

  兩支都由 anon key 呼叫。**權限的門在函式裡**（token 是 128 bit 亂數、
  回傳與寫入都是白名單），不是在這一頁——這一頁的原始碼是公開的。

  ## 網址形狀

    …/public-pages/invite.html?t=<uuid>&a=yes|no

  `t` 是權杖，`a` 只是**預選**（信裡按了哪一顆），頁面上照樣可以改，
  真正的值以送出的那一份為準。院內頁用的是 `/invite/<token>?answer=`——
  兩邊的組法都在 `server/noticeMail.mjs` 的 `inviteReplyUrl` 一支函式裡。

  ## 佔位字串

  `https://qozsykfodmlpchxbwyaf.supabase.co`／`eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFvenN5a2ZvZG1scGNoeGJ3eWFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc1NzQxMjEsImV4cCI6MjA4MzE1MDEyMX0._Vg2wG4dEQi_kjttm1bHsW3-rJHsdi_L6dU274-LvxM` 由 `scripts/publish-invite-page.mjs`
  在上傳時注入。**這個檔案本身不含任何金鑰**，可以照常進版控。
-->
<style>
  :root {
    --n-0:#ffffff; --n-25:#fbfaf9; --n-200:#d9d4ca; --n-300:#bcb7ab;
    --n-500:#8a8578; --n-600:#6b6659; --n-700:#524e44; --n-800:#3a362f; --n-900:#1b1d21;
    --accent:#1d4ed8; --accent-soft:#eaf0fd; --danger:#b42318;
    --r-md:6px; --r-lg:10px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--n-25);
    color: var(--n-900);
    font-family: "PingFang TC", "Microsoft JhengHei", "微軟正黑體", "Noto Sans TC", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .card {
    background: var(--n-0);
    border: 1px solid var(--n-200);
    border-radius: var(--r-lg);
    padding: 16px;
    margin-bottom: 16px;
  }
  h1 { margin: 0; font-size: 16px; font-weight: 600; }
  .case { margin: 4px 0 0; font-size: 13px; color: var(--n-700); }
  dl { display: grid; grid-template-columns: 5em minmax(0,1fr); gap: 4px 8px; margin: 12px 0 0; font-size: 13px; }
  dt { color: var(--n-500); margin: 0; }
  dd { margin: 0; color: var(--n-900); }
  dd.mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; color: var(--n-800); }
  .signer { margin: 12px 0 0; font-size: 12px; color: var(--n-500); }

  fieldset { border: 0; margin: 0 0 16px; padding: 0; }
  legend { padding: 0; margin-bottom: 8px; font-size: 13px; color: var(--n-700); }
  legend.strong { font-weight: 600; color: var(--n-800); }
  .hint { font-size: 12px; color: var(--n-500); font-weight: 400; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid2.big { gap: 12px; }

  .opt {
    display: block; width: 100%;
    border: 1px solid var(--n-300); background: var(--n-0); color: var(--n-700);
    border-radius: var(--r-md); padding: 8px 12px; font: inherit; font-size: 14px;
    cursor: pointer; text-align: center;
  }
  .big .opt { padding: 12px; font-size: 15px; }
  .opt[aria-pressed="true"] {
    border-color: var(--accent); background: var(--accent-soft);
    color: var(--n-900); font-weight: 600;
  }
  .opt:focus-visible, .submit:focus-visible, .ghost:focus-visible, input:focus, textarea:focus {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  input, textarea {
    width: 100%; border: 1px solid var(--n-300); background: var(--n-0);
    border-radius: var(--r-md); padding: 8px 12px; color: var(--n-900);
    /* 16px 不能再小：iOS Safari 對小於 16px 的輸入框會自動放大整頁 */
    font: inherit; font-size: 16px;
  }
  input:focus, textarea:focus { border-color: var(--accent); outline-offset: 0; }
  textarea { resize: vertical; }
  label.field { display: block; margin-bottom: 16px; }
  label.field > span { display: block; margin-bottom: 4px; font-size: 13px; color: var(--n-700); }
  /* 起訖站那一組在 grid 裡，下緣的 16px 由外層的 margin-top 統一給 */
  .grid2 > label.field { margin-bottom: 0; }
  .grid2 > label.field > span, .sub-label { font-size: 12.5px; color: var(--n-600); }
  /* 勾選框：上面那條 `input { width:100% }` 會把它撐成一整條，得擋回來 */
  label.check { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 14px; color: var(--n-800); }
  label.check > input[type="checkbox"] { width: 16px; height: 16px; margin: 0; flex: none; accent-color: var(--accent); }
  /* 同意事項那一句會折行，勾選框要對齊第一行而不是整塊的中線 */
  label.check.top { align-items: flex-start; }
  label.check.top > input[type="checkbox"] { margin-top: 3px; }

  /* 同意事項與本人確認（決策者 2026-09-21）：整段收進一個有底的框，
     與上面的交通段分開——那是「填資料」，這一段是「他本人同意了什麼」。
     版型與院內頁 InviteReplyPage.tsx 那一塊同構，數值待 design 收。 */
  fieldset#consent {
    border: 1px solid var(--n-200); background: var(--n-25);
    border-radius: var(--r-md); padding: 12px;
  }
  fieldset#consent > legend { padding: 0 4px; }
  ol.clauses { list-style: none; margin: 0; padding: 0; font-size: 12.5px; line-height: 1.7; color: var(--n-700); }
  ol.clauses > li + li { margin-top: 6px; }

  .submit {
    display: block; width: 100%; border: 0; border-radius: var(--r-md);
    background: var(--accent); color: #fff; padding: 12px; font: inherit;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .submit[disabled] { opacity: .6; cursor: default; }
  .ghost {
    margin-top: 16px; border: 1px solid var(--n-300); background: var(--n-0);
    color: var(--n-800); border-radius: var(--r-md); padding: 8px 16px;
    font: inherit; font-size: 14px; cursor: pointer;
  }
  .foot { margin: 12px 0 0; font-size: 12px; color: var(--n-500); }
  .err { margin: 0 0 12px; font-size: 13px; color: var(--danger); }
  .center { text-align: center; }
  .center .title { font-size: 16px; font-weight: 600; }
  .center .sub { margin: 8px 0 0; font-size: 13px; color: var(--n-600); }
  .state { padding: 48px 16px; text-align: center; color: var(--n-600); font-size: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div id="loading" class="state">載入中…</div>

  <!-- 權杖不對／查不到：只說「無效」，不透露是哪一種（免得被拿來探測有效的權杖） -->
  <div id="invalid" class="card center" hidden>
    <p class="title">連結無效或已失效</p>
    <p class="sub">請確認是否為信件中的完整網址，或逕與本院承辦人聯繫。</p>
  </div>

  <div id="main" hidden>
    <header class="card">
      <h1>聘兼評選委員意願調查</h1>
      <p class="case" id="case-name"></p>
      <dl>
        <dt>受邀委員</dt><dd id="member-name"></dd>
        <dt id="dt-no" hidden>案號</dt><dd class="mono" id="case-no" hidden></dd>
        <dt id="dt-meeting" hidden>會議時間</dt><dd id="meeting" hidden></dd>
        <dt id="dt-venue" hidden>會議地點</dt><dd id="venue" hidden></dd>
      </dl>
      <p class="signer">國立成功大學醫學院附設醫院　工務室</p>
    </header>

    <!-- 送出後的畫面（回過的人再點進來也先看到這一張，按「修改回覆」回表單） -->
    <section id="done" class="card center" hidden>
      <p class="title">已收到，謝謝</p>
      <p class="sub" id="done-sub"></p>
      <button type="button" class="ghost" id="edit">修改回覆</button>
    </section>

    <section id="form" class="card" hidden>
      <fieldset>
        <legend class="strong">是否惠允擔任本案評選委員</legend>
        <div class="grid2 big">
          <button type="button" class="opt" id="willing-yes" aria-pressed="false">願意擔任</button>
          <button type="button" class="opt" id="willing-no" aria-pressed="false">不克擔任</button>
        </div>
      </fieldset>

      <!-- 不克擔任的人按一下就送出——再逼他填手機地址只會讓他乾脆不回
           （決策者 2026-09-05：「按一下確認送出即完成」） -->
      <div id="details" hidden>
        <label class="field">
          <span>行動電話</span>
          <input id="mobile" type="text" inputmode="tel" maxlength="200" aria-label="行動電話">
        </label>

        <label class="field">
          <span>信件聯絡地址 <span class="hint">（評選相關文件寄達處）</span></span>
          <input id="address" type="text" maxlength="200" aria-label="信件聯絡地址">
        </label>

        <!--
          **先問請不請領**（決策者 2026-09-18：「交通費請領不請領要先問，
          不請領就直接不用往下選了。住在台南的委員一般是不請的。」）——
          台南在地的委員按一下「不請領」就結束，底下整段不出現。
        -->
        <fieldset>
          <legend>是否請領交通費 <span class="hint">（由 30 公里以外遠地前來者依規定支給）</span></legend>
          <div class="grid2">
            <button type="button" class="opt" id="claim-yes" aria-pressed="false" aria-label="交通費 請領">請領</button>
            <button type="button" class="opt" id="claim-no" aria-pressed="false" aria-label="交通費 不請領">不請領</button>
          </div>
        </fieldset>

        <!--
          請領時才問到院方式，而且**依到院方式換欄位**（決策者 2026-09-18：
          「到院方式選完，下面問交通費，又再選一次…要填的是起訖站吧」）。
          高鐵／台鐵問起訖站＋要不要再轉計程車；自行開車只問出發地
          （「就是來醫院了」，目的地不必問）；其他不多問（說明已在方式那一格）。
        -->
        <fieldset id="claim-detail" hidden>
          <legend>到院方式</legend>
          <div class="grid2" id="arrival"></div>
          <div style="margin-top:8px" id="arrival-note-wrap" hidden>
            <input id="arrival-note" type="text" maxlength="200" placeholder="請說明" aria-label="到院方式說明">
          </div>
          <p id="claim-need-arrival" class="sub-label" hidden style="margin:8px 0 0">請先選到院方式</p>
          <!-- 高鐵只有十二站：選高鐵時兩格掛這份清單（點一下就有下拉，仍可自己打）；台鐵站太多，維持自由輸入（決策者 2026-09-18） -->
          <datalist id="hsr-stations"><option value="南港"></option><option value="台北"></option><option value="板橋"></option><option value="桃園"></option><option value="新竹"></option><option value="苗栗"></option><option value="台中"></option><option value="彰化"></option><option value="雲林"></option><option value="嘉義"></option><option value="台南"></option><option value="左營"></option></datalist>
          <div id="claim-rail" hidden style="margin-top:8px">
            <div class="grid2">
              <label class="field">
                <span>起站</span>
                <input id="from-station" type="text" maxlength="40" aria-label="起站">
              </label>
              <label class="field">
                <span>訖站</span>
                <!-- 多半是台南，但**不預填**——在哪一站下車是他說了算 -->
                <input id="to-station" type="text" maxlength="40" placeholder="台南" aria-label="訖站">
              </label>
            </div>
            <label class="check">
              <input type="checkbox" id="taxi-transfer" aria-label="另轉乘計程車到院">
              另轉乘計程車到院
            </label>
          </div>
          <div id="claim-car" hidden style="margin-top:8px">
            <label class="field" style="margin-bottom:0">
              <span class="sub-label">出發地</span>
              <input id="origin" type="text" maxlength="80" placeholder="例：高雄市楠梓區" aria-label="出發地">
            </label>
          </div>
        </fieldset>

        <!--
          **同意事項與本人確認**（決策者 2026-09-21：「意願調查表我們現在用線上的了，
          要如何讓他確認是本人？」）——裁定：專屬連結＋親自輸入全名（須與名單相符）
          ＋勾選同意＋紀錄回覆時間。

          紙本 04 那張靠親筆簽名＋勾「並同意以下事項」三款成立，改線上之後三款不能
          就這樣不見，所以搬到這裡：**選「願意」才展開（這一段在 #details 裡）、
          必勾才送得出**。不克擔任的人整段不出現。

          三款的字寫在下面的 CONSENT_CLAUSES（這一頁是單檔，import 不了院內頁那支
          常數檔），與 src/components/Invite/consentClauses.ts、紙本樣稿
          print_invitation_survey.txt 三處逐字相同——scripts/test-invite-reply.mjs 比對。
        -->
        <fieldset id="consent">
          <legend class="strong">同意事項與本人確認</legend>
          <ol class="clauses" id="consent-clauses"></ol>
          <label class="check top">
            <input type="checkbox" id="agreed" aria-label="本人願意擔任本案評選委員，並同意以上事項">
            本人願意擔任本案評選委員，並同意以上事項
          </label>
          <label class="field" style="margin:12px 0 0">
            <span>請輸入您的姓名（本人確認）</span>
            <input id="signed-name" type="text" maxlength="40" autocomplete="name" aria-label="請輸入您的姓名（本人確認）">
          </label>
          <!-- 打了字卻對不起來才提示；空著不提示（還沒打完就跳紅字是在罵人） -->
          <p class="err" id="name-mismatch" hidden style="margin:4px 0 0">輸入的姓名與受邀委員不符，請確認後再送出；如有疑問請聯繫承辦人</p>
          <p class="sub-label" style="margin:8px 0 0">本回覆經由寄至您電子信箱之專屬連結送出，系統將記錄回覆時間，作為意願調查之紀錄。</p>
        </fieldset>
      </div>

      <label class="field">
        <span>備註（選填）</span>
        <textarea id="note" rows="3" maxlength="500" aria-label="備註"></textarea>
      </label>

      <p class="err" id="submit-error" hidden></p>
      <button type="button" class="submit" id="submit">確認送出</button>
      <p class="foot">送出後仍可再次點選信中連結修改；如有疑義，敬請逕與本院承辦人聯繫。</p>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ── 上傳時注入（scripts/publish-invite-page.mjs）────────────────── */
  var SUPABASE_URL = "https://qozsykfodmlpchxbwyaf.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFvenN5a2ZvZG1scGNoeGJ3eWFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc1NzQxMjEsImV4cCI6MjA4MzE1MDEyMX0._Vg2wG4dEQi_kjttm1bHsW3-rJHsdi_L6dU274-LvxM";

  /* ── 三款同意事項（決策者 2026-09-21）：**法條原文，一個字都不能動**。
        正本在 src/memoTemplates/defaults/print_invitation_survey.txt 的【意願】段，

  var CONSENT_CLAUSES = [

  /* 三句擋關的話與 server/inviteReply.mjs 的 checkInviteConsent、

  var params = new URLSearchParams(location.search);
  var token = (params.get("t") || "").trim().toLowerCase();
  var preset = params.get("a");

  var form = {
    willing: preset !== "no",
    mobile: "", address: "", arrival: "", arrivalNote: "",
    claimTransport: false,
    fromStation: "", toStation: "", origin: "", taxiTransfer: false,
    signedName: "", agreed: false,
    note: ""
  };

  /* 名單上的姓名（invite_public_view 回的那個）——本人確認比對的就是它 */
  var memberName = "";

  /* 高鐵／台鐵＝問起訖站；自行開車＝只問出發地（目的地就是醫院） */
  function isRail() { return form.arrival === "hsr" || form.arrival === "train"; }
  function isCar() { return form.arrival === "car"; }

  /* 姓名比對去掉所有空白（含全形）：「王 大明」＝「王大明」。
     名單上多半沒有空格，委員自己打字時卻常加一格——為了差一格把人擋在門外，
     只會讓他打電話來。與 DB 函式、server/inviteReply.mjs 同一條規則。 */
  function normalizeSignedName(value) {
    return String(value == null ? "" : value).replace(/[\s　]/g, "");
  }

  function nameMatches() {
    return normalizeSignedName(form.signedName) === normalizeSignedName(memberName);
  }

  /* ── 民國年＋星期：「民國 115 年 08 月 31 日（星期一）10:00」
        （與院內頁 InviteReplyPage.meetingText 同一條規則）────────── */
  function meetingText(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    try {
      var parts = new Intl.DateTimeFormat("zh-TW", {
        timeZone: "Asia/Taipei", year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", weekday: "long", hour12: false
      }).formatToParts(d);
      var g = function (t) {
        for (var i = 0; i < parts.length; i++) if (parts[i].type === t) return parts[i].value;
        return "";
      };
      var year = Number(g("year")) - 1911;
      return "民國 " + year + " 年 " + g("month") + " 月 " + g("day") + " 日（" +
        g("weekday") + "）" + g("hour") + ":" + g("minute");
    } catch (e) {
      // 舊瀏覽器沒有完整的 Intl 也不能讓整頁掛掉——寧可少一行也要讓他回得了
      return "";
    }
  }

  function rpc(fn, body) {
    return fetch(SUPABASE_URL.replace(/\/+$/, "") + "/rest/v1/rpc/" + fn, {
      method: "POST",
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: "Bearer " + SUPABASE_ANON_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    });
  }

  function fillRow(dt, dd, value) {
    if (!value) return;
    dd.textContent = value;
    show(dt, true);
    show(dd, true);
  }

  /* ── 畫面：三種狀態只會有一種在（載入中／連結無效／表單）───────── */
  function showInvalid() {
    show($("loading"), false);
    show($("main"), false);
    show($("invalid"), true);
  }

  function paintWilling() {
    $("willing-yes").setAttribute("aria-pressed", String(form.willing === true));
    $("willing-no").setAttribute("aria-pressed", String(form.willing === false));
    show($("details"), form.willing === true);
  }

  function paintArrival() {
    var box = $("arrival");
    for (var i = 0; i < box.children.length; i++) {
      var b = box.children[i];
      b.setAttribute("aria-pressed", String(b.dataset.value === form.arrival));
    }
    show($("arrival-note-wrap"), form.arrival === "other");
  }

  function paintClaim() {
    var claim = form.claimTransport === true;
    $("claim-yes").setAttribute("aria-pressed", String(claim));
    $("claim-no").setAttribute("aria-pressed", String(form.claimTransport === false));
    // 不請領＝整段交通問題到此為止（決策者 2026-09-18）
    show($("claim-detail"), claim);
    // 請領了卻還沒選到院方式＝不知道要問什麼，先請他回去選（不是錯誤，只是提示）
    show($("claim-need-arrival"), claim && !form.arrival);
    show($("claim-rail"), claim && isRail());
    show($("claim-car"), claim && isCar());
    // 高鐵才掛站名清單（台鐵不掛）
    ["from-station", "to-station"].forEach(function (id) {
      if (form.arrival === "hsr") $(id).setAttribute("list", "hsr-stations");
      else $(id).removeAttribute("list");
    });
    $("from-station").value = form.fromStation;
    $("to-station").value = form.toStation;
    $("origin").value = form.origin;
    $("taxi-transfer").checked = form.taxiTransfer === true;
  }

  /* 本人確認那一格：打了字卻與名單對不起來才提示（空著不提示） */
  function paintConsent() {
    $("signed-name").value = form.signedName;
    $("agreed").checked = form.agreed === true;
    show($("name-mismatch"), String(form.signedName).trim() !== "" && !nameMatches());
  }

  function paint() {
    $("mobile").value = form.mobile;
    $("address").value = form.address;
    $("arrival-note").value = form.arrivalNote;
    $("note").value = form.note;
    paintWilling();
    paintArrival();
    paintClaim();
    paintConsent();
  }

  function showDone() {
    $("done-sub").textContent = form.willing
      ? "本院將依核定名單順序另行寄送聘函與開會通知，敬請查收。"
      : "感謝 您撥冗回覆，本院將另洽其他委員。";
    show($("done"), true);
    show($("form"), false);
    window.scrollTo(0, 0);
  }

  function showForm() {
    show($("done"), false);
    show($("form"), true);
  }

  /* ── 選項按鈕（到院方式是資料生出來的，不寫死在 HTML 裡）───────── */
  function buildOptions() {
    /* 三款同意事項也是資料生出來的：字只有 CONSENT_CLAUSES 一份，
       HTML 裡再抄一次就等於這一頁自己有兩份法條 */
    var clauses = $("consent-clauses");
    CONSENT_CLAUSES.forEach(function (text) {
      var li = document.createElement("li");
      li.textContent = text;
      clauses.appendChild(li);
    });

    var arrival = $("arrival");
    ARRIVAL.forEach(function (opt) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "opt";
      b.textContent = opt.label;
      b.dataset.value = opt.v;
      b.setAttribute("aria-pressed", "false");
      b.setAttribute("aria-label", "到院方式 " + opt.label);
      b.addEventListener("click", function () {
        // 再按一次取消選取（他可能只是誤觸）
        form.arrival = form.arrival === opt.v ? "" : opt.v;
        if (form.arrival !== "other") form.arrivalNote = "";
        // 換方式就把不屬於新方式的欄位清掉（高鐵↔台鐵互換保留起訖站——
        // 站名多半一樣，不要害他重打）
        if (!isRail()) { form.fromStation = ""; form.toStation = ""; form.taxiTransfer = false; }
        if (!isCar()) { form.origin = ""; }
        $("arrival-note").value = form.arrivalNote;
        paintArrival();
        paintClaim();
      });
      arrival.appendChild(b);
    });
  }

  function bind() {
    $("willing-yes").addEventListener("click", function () { form.willing = true; paintWilling(); });
    $("willing-no").addEventListener("click", function () { form.willing = false; paintWilling(); });
    $("claim-yes").addEventListener("click", function () {
      form.claimTransport = true;
      paintClaim();
    });
    $("claim-no").addEventListener("click", function () {
      form.claimTransport = false;
      // 說不請領就把到院方式與填過的起訖站一起清掉，免得存下一份自相矛盾的資料
      form.arrival = "";
      form.arrivalNote = "";
      form.fromStation = "";
      form.toStation = "";
      form.origin = "";
      form.taxiTransfer = false;
      $("arrival-note").value = "";
      paintArrival();
      paintClaim();
    });
    $("mobile").addEventListener("input", function (e) { form.mobile = e.target.value; });
    $("address").addEventListener("input", function (e) { form.address = e.target.value; });
    $("arrival-note").addEventListener("input", function (e) { form.arrivalNote = e.target.value; });
    $("from-station").addEventListener("input", function (e) { form.fromStation = e.target.value; });
    $("to-station").addEventListener("input", function (e) { form.toStation = e.target.value; });
    $("origin").addEventListener("input", function (e) { form.origin = e.target.value; });
    $("taxi-transfer").addEventListener("change", function (e) { form.taxiTransfer = e.target.checked; });
    $("signed-name").addEventListener("input", function (e) {
      form.signedName = e.target.value;
      show($("name-mismatch"), String(form.signedName).trim() !== "" && !nameMatches());
    });
    $("agreed").addEventListener("change", function (e) { form.agreed = e.target.checked; });
    $("note").addEventListener("input", function (e) { form.note = e.target.value; });
    $("edit").addEventListener("click", showForm);
    $("submit").addEventListener("click", submit);
  }

  function submit() {
    var btn = $("submit");
    var err = $("submit-error");
    var claim = form.willing && form.claimTransport === true;

    // 請領才有到院方式可言，而核銷要知道他怎麼來——沒選就擋下來
    if (claim && !form.arrival) {
      err.textContent = "請選擇到院方式";
      show(err, true);
      return;
    }
    // 請領就得填得出核銷要的那一段路，不然承辦人還是得打電話問
    if (claim && isRail() && !(form.fromStation.trim() && form.toStation.trim())) {
      err.textContent = "請填寫起站與訖站";
      show(err, true);
      return;
    }
    if (claim && isCar() && !form.origin.trim()) {
      err.textContent = "請填寫出發地";
      show(err, true);
      return;
    }

    /* 本人確認＋三款同意事項（決策者 2026-09-21）——**只有願意擔任才要求**。
       這裡先擋是為了省一趟來回；擋不住的 DB 函式還會擋，兩邊講的話逐字相同。 */
    var signed = String(form.signedName).trim();
    if (form.willing && !signed) {
      err.textContent = ERR_NAME_BLANK;
      show(err, true);
      return;
    }
    if (form.willing && !nameMatches()) {
      err.textContent = ERR_NAME_MISMATCH;
      show(err, true);
      return;
    }
    if (form.willing && form.agreed !== true) {
      err.textContent = ERR_NOT_AGREED;
      show(err, true);
      return;
    }

    btn.disabled = true;
    btn.textContent = "送出中…";
    show(err, false);

    /* 不願意或不請領時不送到院方式：那幾格根本沒展開，送出去只是雜訊。
       **transportModes 不送**——由 DB 函式依到院方式推（只有一份規則）。 */
    var payload = {
      willing: form.willing,
      mobile: form.mobile,
      address: form.address,
      arrival: claim ? form.arrival : "",
      arrivalNote: claim && form.arrival === "other" ? form.arrivalNote : "",
      claimTransport: claim,
      fromStation: claim && isRail() ? form.fromStation.slice(0, MAX_STATION) : "",
      toStation: claim && isRail() ? form.toStation.slice(0, MAX_STATION) : "",
      origin: claim && isCar() ? form.origin.slice(0, MAX_ORIGIN) : "",
      taxiTransfer: claim && isRail() && form.taxiTransfer === true,
      /* 不克擔任不必簽（紙本 04 也只有願意那一欄帶三款），送空的那一份 */
      signedName: form.willing ? signed.slice(0, MAX_SIGNED_NAME) : "",
      agreed: form.willing && form.agreed === true,
      note: form.note
    };

    rpc("invite_public_reply", { p_token: token, p_reply: payload })
      .then(function (res) {
        return res.json().catch(function () { return null; }).then(function (body) {
          if (!res.ok) {
            var code = body && body.code ? String(body.code) : "";
            if (code === "P0002") throw new Error("連結無效或已失效，請確認信件中的完整網址。");
            if (code === "22023") throw new Error((body && body.message) || "填寫的內容有誤，請檢查後再送出。");
            throw new Error("送出失敗，請稍後再試");
          }
          return body;
        });
      })
      .then(function () { showDone(); })
      .catch(function (e) {
        err.textContent = (e && e.message) || "送出失敗，請稍後再試";
        show(err, true);
      })
      .then(function () {
        btn.disabled = false;
        btn.textContent = "確認送出";
      });
  }

  function start() {
    // 形狀不對就不打了：讓一個明顯無效的字串去敲函式只是白跑一趟
    if (!UUID_RE.test(token)) { showInvalid(); return; }

    rpc("invite_public_view", { p_token: token })
      .then(function (res) {
        if (!res.ok) throw new Error("view failed");
        return res.json();
      })
      .then(function (view) {
        if (!view || typeof view !== "object") throw new Error("not found");

        $("case-name").textContent = view.caseName || "";
        memberName = view.memberName || "";
        $("member-name").textContent = memberName;
        fillRow($("dt-no"), $("case-no"), view.caseNumber || "");
        fillRow($("dt-meeting"), $("meeting"), meetingText(view.meetingAt));
        fillRow($("dt-venue"), $("venue"), view.venue || "");

        var previous = view.reply && typeof view.reply === "object" ? view.reply : null;
        form.willing = previous ? previous.willing === true : preset !== "no";
        form.mobile = (previous && previous.mobile) || view.mobile || "";
        form.address = (previous && previous.address) || view.address || "";
        form.arrival = (previous && previous.arrival) || "";
        form.arrivalNote = (previous && previous.arrivalNote) || "";
        form.claimTransport = Boolean(previous && previous.claimTransport);
        // 起訖站／出發地一併回填（改回覆的人不必重打）；舊資料沒有這幾個鍵就是空的
        form.fromStation = (previous && previous.fromStation) || "";
        form.toStation = (previous && previous.toStation) || "";
        form.origin = (previous && previous.origin) || "";
        form.taxiTransfer = Boolean(previous && previous.taxiTransfer);
        // 本人確認也一併回填（改回覆的人不必重打、重勾）；
        // 2026-09-21 之前的舊回覆沒有這兩個鍵，回填就是空的＋沒勾
        form.signedName = (previous && previous.signedName) || "";
        form.agreed = Boolean(previous && previous.agreed);
        form.note = (previous && previous.note) || "";

        buildOptions();
        bind();
        paint();
        show($("loading"), false);
        show($("main"), true);
        // 回過的人先看到「已收到」，要改再按「修改回覆」
        if (previous) showDone(); else showForm();
      })
      .catch(function () { showInvalid(); });
  }

  start();
})();
</script>
</body>
</html>
